<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a5fd0">
<title>BluCheck · Superuser</title>
<link rel="icon" href="/img/blucheck.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/blucheck.css">
</head>
<body>
<div id="authRoot"></div>
<div id="appRoot" hidden>
  <header class="top"><div class="top-in gut">
    <div class="brand">
      <div style="min-width:0">
        <a class="logo" href="/admin"><img src="/img/blucheck.svg" alt="" width="28" height="28"><span>Blu<b>Check</b></span> <span class="pill acc" style="font-family:var(--f-body)">Superuser</span></a>
        <small id="brandSub"></small>
      </div>
      <div class="row"><button class="btn primary sm" data-act="new-az">+ Nuova azienda</button><button class="btn ghost sm" data-act="logout">Esci</button></div>
    </div>
    <nav class="tabs" aria-label="Sezioni">
      <button class="tab" data-tab="panoramica">Panoramica</button>
      <button class="tab" data-tab="aziende">Aziende</button>
      <button class="tab" data-tab="pagamenti">Pagamenti</button>
      <button class="tab" data-tab="piani">Piani</button>
      <button class="tab" data-tab="avvisi">Avvisi</button>
    </nav>
  </div></header>
  <main class="gut" id="main"></main>
</div>
<div id="sheetRoot"></div>
<div id="padRoot"></div>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>

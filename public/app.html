<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a5fd0">
<title>BluCheck</title>
<link rel="icon" href="/img/blucheck.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/blucheck.css">
</head>
<body>
<div id="authRoot"></div>

<div id="appRoot" hidden>
  <header class="top"><div class="top-in gut">
    <div class="brand">
      <div style="min-width:0">
        <a class="logo" href="/app"><img src="/img/blucheck.svg" alt="" width="28" height="28"><span>Blu<b>Check</b></span></a>
        <small id="brandSub"></small>
      </div>
      <button class="btn primary sm" data-act="new-ver">+ Nuova verifica</button>
    </div>
    <nav class="tabs" aria-label="Sezioni">
      <button class="tab" data-tab="scadenze">Scadenze</button>
      <button class="tab" data-tab="apparecchi">Apparecchi</button>
      <button class="tab" data-tab="clienti">Clienti</button>
      <button class="tab" data-tab="verifiche">Rapporti</button>
      <button class="tab" data-tab="impostazioni">Impostazioni</button>
    </nav>
  </div></header>
  <main class="gut" id="main"></main>
</div>
<div id="sheetRoot"></div>
<div id="padRoot"></div>
<div id="barRoot"></div>
<input type="file" id="qrFile" accept="image/*" capture="environment" hidden>

<script src="/vendor/jspdf/jspdf.umd.min.js"></script>
<script src="/vendor/jsqr/jsQR.js"></script>
<script src="/js/common.js"></script>
<script src="/js/pdf.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
